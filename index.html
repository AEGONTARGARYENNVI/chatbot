<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Chennai Civils Academy — AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1a4b8c;--brand-dark:#0d3266;--brand-mid:#1a5ca8;
  --brand-light:#e8f0fb;--brand-pale:#f4f7fd;
  --gold:#c9962a;--gold-light:#fdf3dc;
  --green:#1a7a5a;--green-light:#e6f5ee;
  --red:#b83232;--red-light:#fceaea;
  --gray-50:#f8f8f6;--gray-100:#f0eff8;--gray-200:#d4d3cc;
  --gray-400:#888780;--gray-600:#5a5958;--gray-900:#1a1a18;
  --text:#1a1a18;--text-muted:#5a5958;--text-hint:#888780;
  --border:rgba(0,0,0,0.08);--border-mid:rgba(0,0,0,0.13);
  --bg:#f5f7fc;--surface:#ffffff;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 12px rgba(0,0,0,0.05),0 1px 3px rgba(0,0,0,0.03);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.09),0 2px 8px rgba(0,0,0,0.05);
}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;color:var(--text);
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 700px 500px at 15% 15%,rgba(26,75,140,0.07) 0%,transparent 70%),
    radial-gradient(ellipse 500px 400px at 85% 85%,rgba(201,150,42,0.05) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
.app{position:relative;z-index:1;width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;text-align:center;box-shadow:var(--shadow)}
.stat-val{font-size:20px;font-weight:600;color:var(--text);line-height:1;margin-bottom:3px;font-family:'DM Mono',monospace}
.stat-label{font-size:10px;color:var(--text-hint);text-transform:uppercase;letter-spacing:.05em}

/* Controls */
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tg{display:flex;background:var(--surface);border:0.5px solid var(--border);border-radius:30px;padding:3px;box-shadow:var(--shadow)}
.tb{padding:5px 14px;border-radius:24px;border:none;background:transparent;color:var(--text-muted);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.tb.on-green{background:var(--brand);color:#fff}
.tb.on-blue{background:var(--brand-dark);color:#fff}

/* Chat window */
.cw{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);border:0.5px solid var(--border);overflow:hidden;display:flex;flex-direction:column}

/* Header */
.hdr{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.hdr::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.05);pointer-events:none}
.hdr::before{content:'';position:absolute;left:40%;bottom:-20px;width:80px;height:80px;border-radius:50%;background:rgba(201,150,42,0.08);pointer-events:none}
.av{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;flex-shrink:0;border:1.5px solid rgba(255,255,255,0.25)}
.hi{flex:1;min-width:0}
.hn{color:#fff;font-size:14px;font-weight:600;margin-bottom:2px}
.hs{color:rgba(255,255,255,0.7);font-size:11px;display:flex;align-items:center;gap:5px}
.ldot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.cdb{text-align:right;flex-shrink:0}
.cdv{color:#fff;font-size:15px;font-weight:600;font-family:'DM Mono',monospace;line-height:1}
.cdl{color:rgba(255,255,255,0.6);font-size:10px;margin-top:2px}
.mbadge{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;margin-left:6px;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.9);vertical-align:middle}

/* Messages */
.msgs{padding:14px;min-height:340px;max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:2px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.6;white-space:pre-wrap;animation:msgIn .2s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.bm{background:var(--gray-50);color:var(--text);border-radius:4px 16px 16px 16px;align-self:flex-start;border:0.5px solid var(--border)}
.um{background:var(--brand);color:#fff;border-radius:16px 4px 16px 16px;align-self:flex-end}
.cw-row{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:100%;animation:msgIn .2s ease-out}
.chip{background:var(--surface);border:0.5px solid var(--brand);color:var(--brand-dark);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.chip:hover{background:var(--brand-light);transform:translateY(-1px)}
.chip:disabled{opacity:.4;cursor:default;transform:none}
.hot{background:var(--gold-light);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:12px;color:#5a3a00;line-height:1.55;align-self:stretch;animation:msgIn .2s ease-out}
.hot-t{font-weight:600;font-size:12px;color:#3a2500;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.hdot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1s ease-in-out infinite}
.tw{align-self:flex-start;animation:msgIn .15s ease-out}
.typ{display:flex;gap:4px;padding:10px 14px;background:var(--gray-50);border-radius:4px 16px 16px 16px;border:0.5px solid var(--border);align-items:center}
.td{width:6px;height:6px;border-radius:50%;background:var(--gray-400);animation:bl 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.3;transform:scale(.9)}40%{opacity:1;transform:scale(1)}}

/* Voice bar */
.vbar{height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--red);font-weight:500;background:var(--surface);border-left:0.5px solid var(--border);border-right:0.5px solid var(--border)}

/* Footer */
.ftr{background:var(--gray-50);border-top:0.5px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:8px}
.tinp{flex:1;padding:9px 14px;border-radius:24px;border:0.5px solid var(--border-mid);background:var(--surface);font-size:13px;color:var(--text);outline:none;font-family:'DM Sans',sans-serif;transition:border-color .15s}
.tinp:focus{border-color:var(--brand)}
.tinp::placeholder{color:var(--text-hint)}
.ibtn{width:36px;height:36px;border-radius:50%;border:0.5px solid var(--border-mid);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:all .15s;flex-shrink:0}
.ibtn:hover{background:var(--gray-100);color:var(--text)}
.ibtn.rec{background:var(--red-light);border-color:var(--red);color:var(--red)}
.ibtn.muted{background:var(--red-light);border-color:var(--red);color:var(--red)}
.sbtn{width:36px;height:36px;border-radius:50%;border:none;background:var(--brand);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s;flex-shrink:0}
.sbtn:hover{background:var(--brand-dark);transform:scale(1.05)}
.sbtn:active{transform:scale(.97)}
.rbtn{width:100%;padding:9px;border:0.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-muted);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;box-shadow:var(--shadow)}
.rbtn:hover{background:var(--gray-100);color:var(--text)}

/* NLP keyword map — for smarter text matching */
/* handled in JS */

@media(max-width:480px){body{padding:8px;align-items:flex-start;padding-top:12px}.msgs{max-height:360px}}
</style>
</head>

// ── NLP MATCH ────────────────────────────────────────────────────────────────
function nlpMatch(text){
  var vl=text.toLowerCase().trim();
  if(!vl)return null;
  var map=NLP[lang][mode];
  for(var pattern in map){
    var keywords=pattern.split('|');
    for(var i=0;i<keywords.length;i++){
      if(vl.indexOf(keywords[i].toLowerCase())>-1){
        var key=map[pattern];
        if(key==='__start__')return '__start__';
        var flow=getFlow();
        if(flow[key])return key;
      }
    }
  }
  // Fallback: exact/partial match on flow keys
  var flow=getFlow();
  var best=null;
  Object.keys(flow).forEach(function(k){
    if(k==='start'||k==='Start over')return;
    var kl=k.toLowerCase();
    if(vl===kl)best=k;
    else if(!best&&vl.length>2&&kl.indexOf(vl)>-1)best=k;
  });
  return best;
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function getFlow(){return F[lang][mode]}

function addMsg(text,type){
  var d=document.createElement('div');
  d.className='msg '+(type==='bot'?'bm':'um');
  d.textContent=text;
  chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;
}

function addChips(chips){
  var w=document.createElement('div');
  w.className='cw-row';
  chips.forEach(function(c){
    var b=document.createElement('button');
    b.className='chip';b.textContent=c;
    b.onclick=function(){handleChip(c);};
    w.appendChild(b);
  });
  chatEl.appendChild(w);
  chatEl.scrollTop=chatEl.scrollHeight;
}

function disableChips(){
  chatEl.querySelectorAll('.chip').forEach(function(b){b.disabled=true;});
}

function addHotAlert(){
  var a=document.createElement('div');
  a.className='hot';
  a.innerHTML='<div class="hot-t"><span class="hdot"></span>Hot lead — owner alert</div>High purchase intent detected. Recommend a follow-up call within 30 minutes for best conversion rate.';
  chatEl.appendChild(a);
  chatEl.scrollTop=chatEl.scrollHeight;
  hotLeads++;updateStats();
}

function showTyping(){
  var w=document.createElement('div');
  w.className='tw';w.id='typ';
  w.innerHTML='<div class="typ"><span class="td"></span><span class="td"></span><span class="td"></span></div>';
  chatEl.appendChild(w);chatEl.scrollTop=chatEl.scrollHeight;
}

function removeTyping(){var t=document.getElementById('typ');if(t)t.remove();}

function updateStats(){
  document.getElementById('si').textContent=totalInq;
  document.getElementById('sh').textContent=hotLeads;
  var r=totalInq>0?Math.round((convs/totalInq)*100):0;
  document.getElementById('sc').textContent=r+'%';
}

// BUG FIX: speak only after user interaction to avoid autoplay block
function speak(text){
  if(!speakOn||!voiceUnlocked||!synth)return;
  synth.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=lang==='ta'?'ta-IN':'en-IN';
  // BUG FIX: fallback voice selection for Tamil
  var voices=synth.getVoices();
  var preferred=voices.filter(function(v){return v.lang===u.lang;});
  if(preferred.length===0&&lang==='ta'){
    // Tamil voice not available — use English IN as fallback
    var enIN=voices.filter(function(v){return v.lang==='en-IN';});
    if(enIN.length>0)u.voice=enIN[0];
  } else if(preferred.length>0){
    u.voice=preferred[0];
  }
  u.rate=0.88;u.pitch=1;
  try{synth.speak(u);}catch(e){}
}

// ── INTERACTION ───────────────────────────────────────────────────────────────
function handleChip(chip){
  voiceUnlocked=true; // unlock voice on first user interaction
  if(chip==='Start over'){doRestart();return;}
  disableChips();
  addMsg(chip,'user');
  totalInq++;showTyping();
  var next=getFlow()[chip];
  setTimeout(function(){
    removeTyping();
    if(next){
      if(next.intent){
        intentScore+=next.intent;
        if(next.conversion)convs++;
        if(!hotFired&&intentScore>=5){hotFired=true;addHotAlert();}
      }
      speak(next.msg);
      addMsg(next.msg,'bot');
      if(next.chips&&next.chips.length)addChips(next.chips);
    } else {
      var s=getFlow().start;
      speak(s.msg);addMsg(s.msg,'bot');addChips(s.chips);
    }
    updateStats();
  },650);
}

function sendText(){
  voiceUnlocked=true;
  var v=document.getElementById('inp').value.trim();
  if(!v)return;
  document.getElementById('inp').value='';
  disableChips();
  addMsg(v,'user');
  totalInq++;showTyping();
  setTimeout(function(){
    removeTyping();
    var match=nlpMatch(v);
    if(match==='__start__'){
      var s=getFlow().start;
      speak(s.msg);addMsg(s.msg,'bot');addChips(s.chips);
      updateStats();return;
    }
    var resp=match?getFlow()[match]:null;
    if(resp){
      if(resp.intent)intentScore+=resp.intent;
      if(resp.conversion)convs++;
      if(!hotFired&&intentScore>=5){hotFired=true;addHotAlert();}
      speak(resp.msg);addMsg(resp.msg,'bot');
      if(resp.chips)addChips(resp.chips);
    } else {
      var fb=lang==='en'
        ?"I didn't quite get that. Try one of the options below, or call us at 044-4567 8900."
        :"சரியாக புரியவில்லை. கீழே உள்ள options-ல் ஒன்று தேர்ந்தெடுங்க அல்லது 044-4567 8900 call பண்ணுங்க.";
      speak(fb);addMsg(fb,'bot');addChips(getFlow().start.chips);
    }
    updateStats();
  },650);
}

// ── VOICE ─────────────────────────────────────────────────────────────────────
function setVbar(txt,color){
  var el=document.getElementById('vbar');
  el.textContent=txt;
  el.style.color=color||'var(--red)';
  if(!txt)return;
  setTimeout(function(){el.textContent='';el.style.color='var(--red)';},3000);
}

function toggleSpeak(){
  voiceUnlocked=true;
  speakOn=!speakOn;
  if(!speakOn&&synth)synth.cancel();
  document.getElementById('spkb').classList.toggle('muted',!speakOn);
  setVbar(speakOn?'Voice output on — bot will speak replies':'Voice output off','var(--text-muted)');
}

function toggleVoice(){
  voiceUnlocked=true;
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    setVbar('Voice input needs Chrome browser');return;
  }
  if(recOn){recognition.stop();return;}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang=lang==='ta'?'ta-IN':'en-IN';
  recognition.interimResults=false;
  recognition.maxAlternatives=3;
  recognition.onstart=function(){
    recOn=true;
    document.getElementById('micb').classList.add('rec');
    setVbar('Listening...','var(--brand)');
  };
  recognition.onresult=function(e){
    var t=e.results[0][0].transcript;
    document.getElementById('inp').value=t;
    setVbar('');
    sendText();
  };
  recognition.onerror=function(e){
    recOn=false; // BUG FIX: always reset on error
    document.getElementById('micb').classList.remove('rec');
    var msg=e.error==='not-allowed'?'Microphone permission denied — check browser settings':'Could not hear clearly — tap mic and try again';
    setVbar(msg);
  };
  recognition.onend=function(){
    recOn=false; // BUG FIX: always reset on end
    document.getElementById('micb').classList.remove('rec');
    setTimeout(function(){
      var vbar=document.getElementById('vbar');
      if(vbar.textContent==='Listening...')vbar.textContent='';
    },500);
  };
  try{recognition.start();}catch(e){recOn=false;setVbar('Voice error — try again');}
}

// ── CONTROLS ──────────────────────────────────────────────────────────────────
function setLang(l){
  lang=l;
  // BUG FIX: proper active class management
  document.getElementById('be').className='tb'+(l==='en'?' on-green':'');
  document.getElementById('bt').className='tb'+(l==='ta'?' on-green':'');
  doRestart();
}

function setMode(m){
  mode=m;
  // BUG FIX: aspirant uses green, parent uses blue
  document.getElementById('bst').className='tb'+(m==='student'?' on-green':'');
  document.getElementById('bpa').className='tb'+(m==='parent'?' on-blue':'');
  document.getElementById('mb').textContent=m==='parent'?'Parent':'Aspirant';
  document.getElementById('stxt').textContent=m==='parent'?'Parent support mode':'Online · replies instantly';
  doRestart();
}

function doRestart(){
  chatEl.innerHTML='';
  intentScore=0;totalInq=0;hotLeads=0;convs=0;hotFired=false;
  updateStats();
  if(synth)synth.cancel();
  var s=getFlow().start;
  // Do NOT speak on restart — avoid autoplay block
  addMsg(s.msg,'bot');addChips(s.chips);
}

doRestart();
</script>
